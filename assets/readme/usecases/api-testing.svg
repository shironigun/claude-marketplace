<text x="550" y="200" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">test('POST /orders creates an order', async ({ request }) =&gt; {</text>
<text x="550" y="230" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">  const res = await request.post('/orders', { data: order });</text>
<text x="550" y="260" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">  expect(res.status()).toBe(201);</text>
<text x="550" y="290" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">  OrderSchema.parse(await res.json());   <tspan fill="#86efac">// zod contract</tspan></text>
<text x="550" y="320" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">});</text>
<text x="550" y="350" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace"></text>
<text x="550" y="380" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">test('POST /orders rejects an empty order', async ({ request }) =&gt; {</text>
<text x="550" y="410" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">  const res = await request.post('/orders', { data: { items: [] } });</text>
<text x="550" y="440" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">  expect(res.status()).toBe(400);</text>
<text x="550" y="470" font-size="15" fill="#e2e8f0" xml:space="preserve" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">});</text>

<text x="138" y="134" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b97b8">STEP 1</text>
<text x="138" y="156" font-size="16" font-weight="700" fill="#ffffff">Add the marketplace</text>
<text x="84" y="202" font-size="15" fill="#c7d0e6">Claude Code clones this</text>
<text x="84" y="223" font-size="15" fill="#c7d0e6">repo once and lists its</text>
<text x="84" y="244" font-size="15" fill="#c7d0e6">plugins.</text>
<text x="84" y="266" font-size="13" fill="#9db4ff" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">marketplace add</text>
<path d="M330 190h24m-8 -8 8 8-8 8" fill="none" stroke="#7c9cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="362" y="96" width="258" height="190" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="402" cy="140" r="22" fill="#7c9cff" fill-opacity=".16" stroke="#7c9cff" stroke-opacity=".5"/>
<g transform="translate(390 128) scale(1)" fill="#9db4ff"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></g>
<text x="436" y="134" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b97b8">STEP 2</text>
<text x="436" y="156" font-size="16" font-weight="700" fill="#ffffff">Install a plugin</text>
<text x="382" y="202" font-size="15" fill="#c7d0e6">Pick only what you need,</text>
<text x="382" y="223" font-size="15" fill="#c7d0e6">for you, a project or one</text>
<text x="382" y="244" font-size="15" fill="#c7d0e6">folder.</text>
<text x="382" y="266" font-size="13" fill="#9db4ff" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">plugin install</text>
<path d="M628 190h24m-8 -8 8 8-8 8" fill="none" stroke="#7c9cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="96" width="258" height="190" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="700" cy="140" r="22" fill="#7c9cff" fill-opacity=".16" stroke="#7c9cff" stroke-opacity=".5"/>
<g transform="translate(688 128) scale(1)" fill="#9db4ff"><path d="M20 4H4c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.89-2-2-2m0 14H4V8h16zm-2-1h-6v-2h6zM7.5 17l-1.41-1.41L8.67 13l-2.59-2.59L7.5 9l4 4z"/></g>
<text x="734" y="134" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b97b8">STEP 3</text>
<text x="734" y="156" font-size="16" font-weight="700" fill="#ffffff">Use it in a session</text>
<text x="680" y="202" font-size="15" fill="#c7d0e6">Skills as /plugin:skill,</text>
<text x="680" y="223" font-size="15" fill="#c7d0e6">agents, commands and MCP</text>
<text x="680" y="244" font-size="15" fill="#c7d0e6">servers.</text>
<text x="680" y="266" font-size="13" fill="#9db4ff" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">/qa-engineering:qa</text>
<path d="M926 190h24m-8 -8 8 8-8 8" fill="none" stroke="#7c9cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="958" y="96" width="258" height="190" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="998" cy="140" r="22" fill="#7c9cff" fill-opacity=".16" stroke="#7c9cff" stroke-opacity=".5"/>
<g transform="translate(986 128) scale(1)" fill="#9db4ff"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9z"/></g>
<text x="1032" y="134" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b97b8">STEP 4</text>
<text x="1032" y="156" font-size="16" font-weight="700" fill="#ffffff">Stay in control</text>
<text x="978" y="202" font-size="15" fill="#c7d0e6">No secrets in the repo;</text>
<text x="978" y="223" font-size="15" fill="#c7d0e6">every tracker write waits</text>
<text x="978" y="244" font-size="15" fill="#c7d0e6">for your OK.</text>
<text x="978" y="266" font-size="13" fill="#9db4ff" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">browser sign-in · your .env</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="How a plugin reaches your session" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>How a plugin reaches your session</title>
<defs>
  <linearGradient id="how-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151d3b"/></linearGradient>
  <radialGradient id="how-glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#7c9cff" stop-opacity=".28"/><stop offset="1" stop-color="#7c9cff" stop-opacity="0"/></radialGradient>
  <pattern id="how-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".06"/></pattern>
</defs>

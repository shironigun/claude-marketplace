<text x="106" y="70" font-size="26" font-weight="700" fill="#ffffff">How feature-explainer works</text>
<text x="64" y="104" font-size="16" fill="#c7d0e6">Research once, read-only, then build the edition for the reader you name.</text>
<text x="64" y="146" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">SOURCES</text>
<rect x="64" y="160" width="200" height="88" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.4" />
<text x="164" y="192.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Code and branches</text>
<text x="164" y="214.5" text-anchor="middle" font-size="14" fill="#aab4cf">read with git show</text>

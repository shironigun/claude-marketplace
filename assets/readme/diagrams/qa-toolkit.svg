<path d="M896 445l-11 6M896 445l-11 -6" stroke="#38bdf8" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="830" y="435" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e6">connector</text>
<text x="64" y="578" font-size="15" fill="#c7d0e6">Each skill works on its own. Chain them when you want: write cases, push them, turn a red run into a bug.</text>

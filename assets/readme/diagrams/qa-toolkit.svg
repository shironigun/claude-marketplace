<text x="106" y="70" font-size="26" font-weight="700" fill="#ffffff">How qa-toolkit works</text>
<text x="64" y="104" font-size="16" fill="#c7d0e6">Four tools that work on their own. Only two need a tracker, and any tracker works.</text>

<text x="600" y="433.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Cases to tracker</text>
<text x="600" y="455.5" text-anchor="middle" font-size="14" fill="#aab4cf">Creates Test Case work items</text>
<rect x="510" y="486" width="180" height="28" rx="14" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-opacity=".6"/><text x="600" y="505" text-anchor="middle" font-size="13" font-weight="600" fill="#38bdf8">uses your tracker</text>

<text x="106" y="70" font-size="26" font-weight="700" fill="#ffffff">How how-to-guides works</text>
<text x="64" y="104" font-size="16" fill="#c7d0e6">Facts from the source, written to a standard, built in your brand, with gaps sent back to product.</text>
<text x="64" y="146" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">1  LEARN</text>
<rect x="64" y="160" width="230" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="179" y="196.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Code</text>
<text x="179" y="218.5" text-anchor="middle" font-size="14" fill="#aab4cf">read-only</text>
<rect x="64" y="272" width="230" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="179" y="308.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">The app</text>
<text x="179" y="330.5" text-anchor="middle" font-size="14" fill="#aab4cf">with demo data</text>
<rect x="64" y="384" width="230" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="179" y="420.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Help content</text>
<text x="179" y="442.5" text-anchor="middle" font-size="14" fill="#aab4cf">words readers know</text>
<text x="350" y="146" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">2  WRITE TO THE STANDARD</text>
<rect x="350" y="160" width="400" height="70" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="550" y="183.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Before you begin</text>
<text x="550" y="205.5" text-anchor="middle" font-size="14" fill="#aab4cf">the problem, setup, availability</text>
<rect x="350" y="242" width="400" height="70" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="550" y="265.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">How it works</text>
<text x="550" y="287.5" text-anchor="middle" font-size="14" fill="#aab4cf">every label on screen, once</text>
<rect x="350" y="324" width="400" height="70" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="550" y="347.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Tasks</text>
<text x="550" y="369.5" text-anchor="middle" font-size="14" fill="#aab4cf">action, then You'll see, then why</text>
<rect x="350" y="406" width="400" height="70" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="550" y="429.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Questions readers ask</text>
<text x="550" y="451.5" text-anchor="middle" font-size="14" fill="#aab4cf">short, direct answers</text>
<rect x="350" y="488" width="400" height="70" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" />
<text x="550" y="511.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">If something goes wrong</text>
<text x="550" y="533.5" text-anchor="middle" font-size="14" fill="#aab4cf">what you see, what to do</text>
<path d="M298 208L346 208" stroke="#fb923c" stroke-opacity="0.45" stroke-width="2.2" fill="none" />
<path d="M346 208l-11 6M346 208l-11 -6" stroke="#fb923c" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round" fill="none"/>

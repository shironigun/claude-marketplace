<path d="M346 432l-11 6M346 432l-11 -6" stroke="#fb923c" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="810" y="146" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">3  BUILD</text>
<rect x="810" y="160" width="406" height="84" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.4" stroke-dasharray="6 5"/>
<text x="1013" y="190.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">howto-brand.json</text>
<text x="1013" y="212.5" text-anchor="middle" font-size="14" fill="#aab4cf">Your logo, colours, font and help line</text>
<rect x="810" y="292" width="406" height="90" rx="14" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-opacity="0.8" />
<text x="1013" y="325.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Branded PDF</text>
<text x="1013" y="347.5" text-anchor="middle" font-size="14" fill="#aab4cf">Checked against the standard as it builds</text>
<path d="M1013 248L1013 288" stroke="#fb923c" stroke-opacity="0.85" stroke-width="2.2" fill="none" />
<path d="M1013 288l-6 -11M1013 288l6 -11" stroke="#fb923c" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<path d="M753.966830250789 303.4319866415709L806.033169749211 310.17924445994095" stroke="#fb923c" stroke-opacity="0.85" stroke-width="2.2" fill="none" />
<path d="M806.033169749211 310.17924445994095l-11.679873303214228 4.536580168019023M806.033169749211 310.17924445994095l-10.13769307612561 -7.36391058434816" stroke="#fb923c" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="810" y="432" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">4  REPORT BACK TO PRODUCT</text>
<rect x="810" y="446" width="126" height="40" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.4" />
<text x="873" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Questions</text>
<rect x="950" y="446" width="126" height="40" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.4" />
<text x="1013" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Change requests</text>
<rect x="1090" y="446" width="126" height="40" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.4" />
<text x="1153" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Bugs</text>
<text x="810" y="516" font-size="14" fill="#aab4cf">Anything it can't confirm goes on a list,</text><text x="810" y="536" font-size="14" fill="#aab4cf">never into the guide as a guess.</text>
</svg>

<text x="164" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Deployments</text>
<text x="64" y="560" font-size="13" fill="#aab4cf">both boards, plus work</text><text x="64" y="578" font-size="13" fill="#aab4cf">that shipped with no ticket</text>

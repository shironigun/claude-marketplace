<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="How ui-testing works" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>How ui-testing works</title>
<defs>
  <linearGradient id="d-ui-testing-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151d3b"/></linearGradient>
  <radialGradient id="d-ui-testing-glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#f472b6" stop-opacity=".28"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <pattern id="d-ui-testing-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".06"/></pattern>
</defs>
<rect width="1280" height="620" rx="26" fill="url(#d-ui-testing-bg)"/>
<rect width="1280" height="620" rx="26" fill="url(#d-ui-testing-dots)"/>
<rect width="1280" height="620" rx="26" fill="url(#d-ui-testing-glow)"/>
<rect x=".5" y=".5" width="1279" height="619" rx="26" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<g transform="translate(64 46) scale(1.25)" fill="#f472b6"><path d="M13 1.07V9h7c0-4.08-3.05-7.44-7-7.93M4 15c0 4.42 3.58 8 8 8s8-3.58 8-8v-4H4zm7-13.93C7.05 1.56 4 4.92 4 9h7z"/></g>
<text x="106" y="70" font-size="26" font-weight="700" fill="#ffffff">How ui-testing works</text>
<text x="64" y="104" font-size="16" fill="#c7d0e6">One story, two paths: author cases and specs, or create Test Cases in your tracker.</text>
<rect x="64" y="300" width="250" height="110" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="189" y="343.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Story or acceptance criteria</text>
<text x="189" y="365.5" text-anchor="middle" font-size="14" fill="#aab4cf">Paste it, or name the ticket</text>
<text x="380" y="150" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">AUTHOR AND SCRIPT</text>
<rect x="380" y="166" width="240" height="100" rx="14" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.8" />
<text x="500" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">tester</text>
<text x="500" y="217" text-anchor="middle" font-size="14" fill="#aab4cf">Reviews like a senior QA</text>
<text x="500" y="236" text-anchor="middle" font-size="14" fill="#aab4cf">analyst</text>
<rect x="690" y="166" width="250" height="100" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="815" y="204.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">UI test cases</text>
<text x="815" y="226.5" text-anchor="middle" font-size="14" fill="#aab4cf">Click by click, house style</text>
<rect x="990" y="166" width="226" height="100" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="1103" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">UI spec</text>
<text x="1103" y="217" text-anchor="middle" font-size="14" fill="#aab4cf">Playwright + TypeScript,</text>
<text x="1103" y="236" text-anchor="middle" font-size="14" fill="#aab4cf">both ways</text>
<text x="380" y="430" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">CREATE IN YOUR TRACKER</text>
<rect x="380" y="446" width="240" height="100" rx="14" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.8" />
<text x="500" y="475" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">buggy</text>
<text x="500" y="497" text-anchor="middle" font-size="14" fill="#aab4cf">Writes the cases for the</text>
<text x="500" y="516" text-anchor="middle" font-size="14" fill="#aab4cf">ticket</text>
<rect x="690" y="446" width="526" height="100" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="953" y="484.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Test Case work items</text>
<text x="953" y="506.5" text-anchor="middle" font-size="14" fill="#aab4cf">In Azure DevOps, linked to the source ticket</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="How api-testing works" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>How api-testing works</title>
<defs>
  <linearGradient id="d-api-testing-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151d3b"/></linearGradient>
  <radialGradient id="d-api-testing-glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#a3e635" stop-opacity=".28"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
  <pattern id="d-api-testing-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".06"/></pattern>
</defs>
<rect width="1280" height="620" rx="26" fill="url(#d-api-testing-bg)"/>
<rect width="1280" height="620" rx="26" fill="url(#d-api-testing-dots)"/>
<rect width="1280" height="620" rx="26" fill="url(#d-api-testing-glow)"/>
<rect x=".5" y=".5" width="1279" height="619" rx="26" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<g transform="translate(64 46) scale(1.25)" fill="#a3e635"><path d="m14 12-2 2-2-2 2-2zm-2-6 2.12 2.12 2.5-2.5L12 1 7.38 5.62l2.5 2.5zm-6 6 2.12-2.12-2.5-2.5L1 12l4.62 4.62 2.5-2.5zm12 0-2.12 2.12 2.5 2.5L23 12l-4.62-4.62-2.5 2.5zm-6 6-2.12-2.12-2.5 2.5L12 23l4.62-4.62-2.5-2.5z"/></g>
<text x="106" y="70" font-size="26" font-weight="700" fill="#ffffff">How api-testing works</text>
<text x="64" y="104" font-size="16" fill="#c7d0e6">Cases at three levels, turned into runnable specs and back, and a bug draft when a run fails.</text>
<text x="64" y="146" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">THREE LEVELS OF API CASES</text>
<rect x="64" y="160" width="370" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a3e635" stroke-opacity="0.4" />
<text x="249" y="194.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Contract</text>
<text x="249" y="216.5" text-anchor="middle" font-size="14" fill="#aab4cf">Response shapes checked with zod schemas</text>
<rect x="455" y="160" width="370" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a3e635" stroke-opacity="0.4" />
<text x="640" y="194.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Endpoints</text>
<text x="640" y="216.5" text-anchor="middle" font-size="14" fill="#aab4cf">The happy path and the negative matrix</text>
<rect x="846" y="160" width="370" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a3e635" stroke-opacity="0.4" />
<text x="1031" y="194.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Workflows</text>
<text x="1031" y="216.5" text-anchor="middle" font-size="14" fill="#aab4cf">Calls chained together, end to end</text>
<text x="64" y="296" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">CASES AND SPECS, BOTH WAYS</text>
<rect x="64" y="310" width="380" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a3e635" stroke-opacity="0.4" />
<text x="254" y="344.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Test cases</text>
<text x="254" y="366.5" text-anchor="middle" font-size="14" fill="#aab4cf">Readable, house style</text>
<rect x="836" y="310" width="380" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a3e635" stroke-opacity="0.4" />
<text x="1026" y="344.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Runnable specs</text>
<text x="1026" y="366.5" text-anchor="middle" font-size="14" fill="#aab4cf">Playwright + TypeScript + zod</text>
<path d="M448 356L832 356" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" fill="none" />
<path d="M832 356l-11 6M832 356l-11 -6" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="640" y="346" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e6">api-tester writes the spec</text>
<path d="M832 378L448 378" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/>
<path d="M448 378l11 -6M448 378l11 6" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="640" y="402" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e6">or reads an existing spec back into cases</text>
<text x="64" y="456" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">WHEN A RUN GOES RED</text>
<rect x="64" y="470" width="250" height="88" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f87171" stroke-opacity="0.4" />
<text x="189" y="502.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Red run</text>
<text x="189" y="524.5" text-anchor="middle" font-size="14" fill="#aab4cf">An assertion or a zod issue</text>
<rect x="366" y="470" width="250" height="88" rx="14" fill="#a3e635" fill-opacity="0.16" stroke="#a3e635" stroke-opacity="0.8" />
<text x="491" y="502.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">api-bugger</text>
<text x="491" y="524.5" text-anchor="middle" font-size="14" fill="#aab4cf">Triages the failure</text>
<rect x="668" y="470" width="250" height="88" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a3e635" stroke-opacity="0.4" />
<text x="793" y="502.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Bug draft</text>
<text x="793" y="524.5" text-anchor="middle" font-size="14" fill="#aab4cf">House style, for review</text>
<rect x="966" y="470" width="250" height="88" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a3e635" stroke-opacity="0.4" stroke-dasharray="6 5"/>
<text x="1091" y="493" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">File it</text>
<text x="1091" y="515" text-anchor="middle" font-size="14" fill="#aab4cf">with bug-suite or</text>
<text x="1091" y="534" text-anchor="middle" font-size="14" fill="#aab4cf">qa-engineering</text>
<path d="M318 514L362 514" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" fill="none" />
<path d="M362 514l-11 6M362 514l-11 -6" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<path d="M620 514L664 514" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" fill="none" />
<path d="M664 514l-11 6M664 514l-11 -6" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<path d="M922 514L962 514" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" fill="none" />
<path d="M962 514l-11 6M962 514l-11 -6" stroke="#a3e635" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<circle cx="942" cy="514" r="14" fill="#fbbf24"/><g transform="translate(933 505) scale(0.75)" fill="#0b1020"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2m-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2m3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1z"/></g>
<circle cx="1048" cy="94" r="11" fill="#fbbf24"/><g transform="translate(1041 87) scale(0.5833333333333334)" fill="#0b1020"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2m-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2m3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1z"/></g><text x="1066" y="99" font-size="14" fill="#c7d0e6">waits for your OK</text>
</svg>

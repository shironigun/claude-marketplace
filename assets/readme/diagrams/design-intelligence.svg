<path d="M684 438l-6 11M684 438l6 11" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="813.5" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#c7d0e6">fix and review again until it passes</text>
<rect x="330" y="538" width="886" height="52" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" stroke-dasharray="6 5"/>
<text x="773" y="552.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">skill-maintenance</text>
<text x="773" y="574.5" text-anchor="middle" font-size="14" fill="#aab4cf">keeps the six skills and the shared design knowledge current</text>

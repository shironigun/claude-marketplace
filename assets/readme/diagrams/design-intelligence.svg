<text x="106" y="70" font-size="26" font-weight="700" fill="#ffffff">How design-intelligence works</text>
<text x="64" y="104" font-size="16" fill="#c7d0e6">Your design system in, compliant MUI out, reviewed until it passes.</text>
<rect x="330" y="150" width="886" height="64" rx="14" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.8" />
<text x="773" y="170.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">design-intelligence-steward</text>
<text x="773" y="192.5" text-anchor="middle" font-size="14" fill="#aab4cf">one agent picks the skills and their order</text>
<text x="64" y="246" font-size="13" font-weight="700" letter-spacing="2" fill="#8b97b8">INPUTS</text>
<rect x="64" y="262" width="220" height="88" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="174" y="294.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Figma screen</text>
<text x="174" y="316.5" text-anchor="middle" font-size="14" fill="#aab4cf">a frame or its link</text>
<rect x="64" y="366" width="220" height="88" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" stroke-dasharray="6 5"/>
<text x="174" y="389" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Your design system</text>
<text x="174" y="411" text-anchor="middle" font-size="14" fill="#aab4cf">local, never in the</text>
<text x="174" y="430" text-anchor="middle" font-size="14" fill="#aab4cf">plugin</text>
<rect x="64" y="470" width="220" height="88" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="174" y="502.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Work item</text>
<text x="174" y="524.5" text-anchor="middle" font-size="14" fill="#aab4cf">optional context</text>
<rect x="330" y="300" width="190" height="132" rx="14" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.8" />
<text x="425" y="354.5" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Analyse</text>
<text x="425" y="376.5" text-anchor="middle" font-size="14" fill="#aab4cf">figma-design-analysis</text>
<path d="M302 306V514" stroke="#f472b6" stroke-opacity=".6" stroke-width="2.2"/>

<path d="M1042 366L1080 366" stroke="#f472b6" stroke-opacity="0.85" stroke-width="2.2" fill="none" />
<path d="M1080 366l-11 6M1080 366l-11 -6" stroke="#f472b6" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>

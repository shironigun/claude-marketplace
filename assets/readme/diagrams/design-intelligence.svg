<path d="M326.2337256158645 401.3310249829428l-8.336326838056065 9.3544457264504M326.2337256158645 401.3310249829428l-12.378182274689289 -1.9443774259561573" stroke="#f472b6" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<rect x="566" y="300" width="236" height="132" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="684" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Generate</text>
<text x="684" y="348" text-anchor="middle" font-size="14" fill="#aab4cf">figma-to-code, then</text>
<text x="684" y="367" text-anchor="middle" font-size="14" fill="#aab4cf">design-system-generation, or</text>
<text x="684" y="386" text-anchor="middle" font-size="14" fill="#aab4cf">figma-screen-generation for</text>
<text x="684" y="405" text-anchor="middle" font-size="14" fill="#aab4cf">a Figma screen</text>
<rect x="848" y="300" width="190" height="132" rx="14" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.8" />
<text x="943" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Review</text>
<text x="943" y="367" text-anchor="middle" font-size="14" fill="#aab4cf">design-system-review,</text>
<text x="943" y="386" text-anchor="middle" font-size="14" fill="#aab4cf">against your rules</text>
<rect x="1084" y="300" width="132" height="132" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4" />
<text x="1150" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">PASS</text>
<text x="1150" y="367" text-anchor="middle" font-size="14" fill="#aab4cf">compliant code</text>
<text x="1150" y="386" text-anchor="middle" font-size="14" fill="#aab4cf">or screen</text>

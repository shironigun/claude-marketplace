<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="How design-intelligence works" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>How design-intelligence works</title>

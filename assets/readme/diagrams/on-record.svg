<text x="106" y="70" font-size="26" font-weight="700" fill="#ffffff">How on-record works</text>
<text x="64" y="104" font-size="16" fill="#c7d0e6">Facts first: every claim sourced and approved before drafting, every number traced before you paste.</text>
